# Cucumber no publica los informes en la nube (cucumber.publish) ni pregunta por ello
cucumber.publish.quiet=true
# Nombre completo en los informes de JUnit: "Característica > Regla > Escenario"
cucumber.junit-platform.naming-strategy=long
# Los escenarios comparten el catalogo en memoria de la aplicacion: se ejecutan uno tras otro
cucumber.execution.parallel.enabled=false
